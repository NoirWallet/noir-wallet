name: Extension CI

on:
  pull_request:
    branches: [main, v2, 'release/**']
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/extension/**'
      - '!packages/extension/**/*.md'
      - 'packages/sdk/package.json'
      - 'packages/evm-history-worker/**'
      - '!packages/evm-history-worker/**/*.md'
      - 'scripts/extension-release.mjs'
      - 'scripts/lib/extension-release-history.mjs'
      - 'scripts/extract-changelog.mjs'
      - 'scripts/extension-preview-comment.mjs'
      - 'scripts/wasm-package.mjs'
      - 'scripts/lib/wasm-package-integrity.mjs'
      - 'scripts/run-core-tests.mjs'
      - 'scripts/register-test-loader.mjs'
      - 'scripts/typescript-test-loader.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'LICENSE'
      - 'tsconfig.base.json'
      - '.npmrc'
      - 'wasm-package.lock.json'
      - '.github/workflows/extension-ci.yml'
      - '.github/workflows/extension-release.yml'
      - '.github/workflows/extension-preview-comment.yml'

concurrency:
  group: extension-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: wallet
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: wallet/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: wallet/.node-version
          cache: pnpm
          cache-dependency-path: wallet/pnpm-lock.yaml
      - name: Verify the tested merge commit
        id: source
        run: |
          set -euo pipefail
          test "$(git -C wallet rev-parse HEAD)" = "$GITHUB_SHA"
      - run: pnpm install --frozen-lockfile
        working-directory: wallet
      - name: Determine source build profile
        id: profile
        working-directory: release-tools
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { sourceProfileForVersion } from './scripts/extension-release.mjs'
          const { version } = JSON.parse(readFileSync('../wallet/packages/extension/package.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `source_profile=${sourceProfileForVersion(version.split('-')[0])}\n`)
          NODE
      - run: pnpm verify-wasm-pkg
        if: steps.profile.outputs.source_profile == 'zcash'
        working-directory: wallet
      - name: Type-check V2 EVM history Worker
        if: steps.profile.outputs.source_profile == 'multichain'
        run: pnpm --filter @noir-wallet/evm-history-worker type-check
        working-directory: wallet
      - run: pnpm test
        working-directory: wallet
      - name: Build and type-check extension
        working-directory: wallet
        env:
          BUILD_CHANNEL: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'beta' || 'development' }}
          GA_API_SECRET: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.GA_API_SECRET || '' }}
          CUSTOM_ANALYTICS_PASSWORD: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.CUSTOM_ANALYTICS_PASSWORD || '' }}
          BETA_INVITE_REQUIRED: ${{ steps.profile.outputs.source_profile == 'multichain' && '1' || '' }}
          EVM_HISTORY_API_ORIGIN: ${{ steps.profile.outputs.source_profile == 'multichain' && vars.EVM_HISTORY_API_ORIGIN || '' }}
          RHEA_SWAP_ACCESS_TOKEN: ${{ steps.profile.outputs.source_profile == 'multichain' && github.event.pull_request.head.repo.full_name == github.repository && secrets.RHEA_SWAP_ACCESS_TOKEN || '' }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_PROFILE: ${{ steps.profile.outputs.source_profile }}
        run: |
          if [ "$SOURCE_PROFILE" = multichain ] && [ "$PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] && [ -z "${RHEA_SWAP_ACCESS_TOKEN//[[:space:]]/}" ]; then
            echo '::error::RHEA_SWAP_ACCESS_TOKEN is required for repository preview builds'
            exit 1
          fi
          pnpm build:extension
      - run: pnpm build:extension:testnet
        if: steps.profile.outputs.source_profile == 'zcash'
        working-directory: wallet
        env:
          BUILD_CHANNEL: beta
      - name: Stage tested ZIPs
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOURCE_PROFILE: ${{ steps.profile.outputs.source_profile }}
        run: |
          set -euo pipefail
          zips=(wallet/packages/extension/dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ] || [ ! -f "${zips[0]}" ]; then
            echo '::error::Expected exactly one mainnet extension ZIP'
            exit 1
          fi
          mkdir -p raw-zips/dist
          cp "${zips[0]}" raw-zips/dist/
          if [ "$SOURCE_PROFILE" = zcash ]; then
            testnet_zips=(wallet/packages/extension/dist-testnet/*.zip)
            if [ "${#testnet_zips[@]}" -ne 1 ] || [ ! -f "${testnet_zips[0]}" ]; then
              echo '::error::Expected exactly one testnet extension ZIP'
              exit 1
            fi
            mkdir raw-zips/dist-testnet
            cp "${testnet_zips[0]}" raw-zips/dist-testnet/
          fi
      - name: Package tested previews
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: package
        env:
          RELEASE_MODE: preview
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          BUILD_CHANNEL: beta
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, copyFileSync, mkdirSync, readFileSync, readdirSync, writeFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const { version } = JSON.parse(readFileSync('wallet/packages/extension/package.json', 'utf8'))
          if (!/^\d+\.\d+\.\d+(?:-beta\.[1-9]\d*)?$/.test(version)) throw new Error('Invalid preview version')
          const { SOURCE_SHA, SOURCE_REF, WORKFLOW_SHA, BUILD_CHANNEL, PR_NUMBER, PR_HEAD_SHA, PR_BASE_SHA, GITHUB_REPOSITORY, GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT } = process.env
          const artifactLabel = `v${version.split('-')[0]}-pr.${PR_NUMBER}.${SOURCE_SHA.slice(0, 7)}`
          const zips = readdirSync('raw-zips/dist').filter(name => name.endsWith('.zip'))
          if (zips.length !== 1) throw new Error('Expected one V2 preview ZIP')
          mkdirSync('release-assets')
          const name = `noir-wallet-${artifactLabel}.zip`
          copyFileSync(`raw-zips/dist/${zips[0]}`, `release-assets/${name}`)
          const zip = readFileSync(`release-assets/${name}`)
          const sha256 = createHash('sha256').update(zip).digest('hex')
          const metadata = {
            schemaVersion: 1, mode: 'preview', buildChannel: BUILD_CHANNEL, version,
            sourceSha: SOURCE_SHA, sourceRef: SOURCE_REF, workflowSha: WORKFLOW_SHA,
            repository: GITHUB_REPOSITORY, runId: GITHUB_RUN_ID, runAttempt: GITHUB_RUN_ATTEMPT,
            prNumber: PR_NUMBER, prHeadSha: PR_HEAD_SHA, prBaseSha: PR_BASE_SHA, artifactLabel,
            assets: [{ network: 'multichain', name, sha256, size: zip.length }]
          }
          writeFileSync('release-assets/release-metadata.json', `${JSON.stringify(metadata, null, 2)}\n`)
          writeFileSync('release-assets/SHA256SUMS', `${sha256}  ${name}\n`)
          writeFileSync('release-assets/release-body.md', `PR preview ${version}\n\nTested merge commit: ${SOURCE_SHA}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact_label=${artifactLabel}\n`)
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: noir-wallet-development-${{ steps.package.outputs.artifact_label }}
          path: release-assets/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
