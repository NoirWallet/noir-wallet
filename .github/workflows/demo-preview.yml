name: Demo Preview

on:
  workflow_run:
    workflows: [Extension CI]
    types: [completed]

# Pages replaces a whole site. Serialize uploads to preserve other PR previews.
concurrency:
  group: demo-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.report.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only the default-branch publisher is executable, never downloaded PR source.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - name: Resolve current same-repository V2 preview
        id: source
        run: node scripts/demo-preview.mjs resolve
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.source.outputs.artifact_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          path: preview
      - name: Preserve existing site and add verified PR preview
        if: steps.source.outputs.artifact_id != ''
        run: node scripts/demo-preview.mjs stage
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.source.outputs.artifact_id != ''
        with:
          path: pages-site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        if: steps.source.outputs.artifact_id != ''
      - name: Link paired demo in PR checks
        id: report
        if: steps.source.outputs.artifact_id != ''
        run: node scripts/demo-preview.mjs report
