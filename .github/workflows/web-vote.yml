name: Website Voting Worker

on:
  push:
    branches: [main]
    paths:
      - 'packages/web-vote/**'
      - 'packages/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.npmrc'
      - 'scripts/run-core-tests.mjs'
      - 'scripts/register-test-loader.mjs'
      - 'scripts/typescript-test-loader.mjs'
      - '.github/workflows/web-vote.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/web-vote/**'
      - 'packages/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.npmrc'
      - 'scripts/run-core-tests.mjs'
      - 'scripts/register-test-loader.mjs'
      - 'scripts/typescript-test-loader.mjs'
      - '.github/workflows/web-vote.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-vote-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify voting Worker
        run: pnpm --filter @noir-wallet/web-vote verify
      - name: Verify voting client
        run: |
          pnpm --filter @noir-wallet/web type-check
          pnpm --filter @noir-wallet/web test
          pnpm build:web

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event.repository.fork == false
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy voting Worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets before deploying the voting Worker.'
            exit 1
          fi
          node --input-type=module -e '
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              },
              signal: AbortSignal.timeout(20000)
            })
            if (!response.ok) throw new Error(`Could not verify current main: HTTP ${response.status}`)
            const ref = await response.json()
            if (ref.object?.sha !== process.env.GITHUB_SHA) {
              throw new Error("This run is stale. Start a new workflow run from current main to avoid replacing a newer Worker deployment.")
            }
          '
          pnpm --filter @noir-wallet/web-vote deploy
      - name: Check deployed voting API
        run: |
          pnpm --filter @noir-wallet/web exec node --import ../../scripts/register-test-loader.mjs --input-type=module -e '
            import { parseVoteSnapshot } from "./src/lib/frost-vote.ts"
            const response = await fetch("https://www.zknoir.com/api/frost-votes", {
              cache: "no-store",
              signal: AbortSignal.timeout(20000)
            })
            if (!response.ok) throw new Error(`Voting API returned HTTP ${response.status}`)
            const snapshot = parseVoteSnapshot(await response.json())
            if (snapshot.choice !== null) throw new Error("Anonymous API read returned a voter choice")
            console.log("Voting API is ready")
          '
