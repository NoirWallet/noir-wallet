name: Extension Preview Download

on:
  workflow_run:
    workflows: [Build Extension, Extension Checks]
    types: [requested, completed]

concurrency:
  group: extension-preview-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  comment:
    # Requested events can still carry the static name; the script refetches the run title.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.action == 'requested' ||
       (github.event.workflow_run.path == '.github/workflows/build-extension.yml' &&
        (github.event.workflow_run.display_title || github.event.workflow_run.name) == 'Requested extension preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This checkout is the trusted default-branch commit, never the PR source.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Update the PR download comment
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ github.event.workflow_run.id }}
          PREVIEW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PREVIEW_EVENT_ACTION: ${{ github.event.action }}
        run: node scripts/extension-preview-comment.mjs
