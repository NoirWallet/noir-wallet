name: Extension Checks

on:
  pull_request:
    branches: [main, v2, 'release/**']
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/extension/**'
      - '!packages/extension/**/*.md'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'LICENSE'
      - 'tsconfig.base.json'
      - '.npmrc'
      - 'wasm-package.lock.json'
      - '.github/workflows/extension-checks.yml'

concurrency:
  group: extension-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Determine source build profile
        id: profile
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { sourceProfileForVersion } from './scripts/extension-release.mjs'
          const { version } = JSON.parse(readFileSync('packages/extension/package.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `source_profile=${sourceProfileForVersion(version)}\n`)
          NODE
      - run: pnpm verify-wasm-pkg
        if: steps.profile.outputs.source_profile == 'zcash'
      - name: Type-check V2 EVM history Worker
        if: steps.profile.outputs.source_profile == 'multichain'
        run: pnpm --filter @noir-wallet/evm-history-worker type-check
      - run: pnpm test
