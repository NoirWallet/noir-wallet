name: SDK

on:
  workflow_dispatch:
  pull_request:
    branches: [main, v2]
    paths:
      - 'packages/sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/sdk.yml'
      - 'scripts/ci-validated-scope.mjs'
  push:
    branches: [main, v2]
    paths:
      - 'packages/sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/sdk.yml'
      - 'scripts/ci-validated-scope.mjs'

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  HUSKY: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check prior validated inputs
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-validated-scope.mjs sdk

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'
      - run: pnpm --filter @noir-wallet/sdk type-check
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'
      - run: pnpm --filter @noir-wallet/sdk build
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'
      - run: pnpm --filter @noir-wallet/sdk --if-present test
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'
      - run: pnpm --filter @noir-wallet/example type-check
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'
      - run: pnpm --filter @noir-wallet/example build
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'
        env:
          GITHUB_PAGES: 'true'
      - run: pnpm --filter @noir-wallet/sdk pack:dry
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'

      - name: Upload example for GitHub Pages
        if: github.repository == 'NoirWallet/noir-wallet' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: packages/sdk/example/dist

  deploy:
    if: github.repository == 'NoirWallet/noir-wallet' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy example to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
