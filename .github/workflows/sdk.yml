name: SDK

on:
  push:
    branches: [main, v2]
    paths:
      - 'packages/sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/sdk.yml'
  pull_request:
    branches: [main, v2]
    paths:
      - 'packages/sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/sdk.yml'

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @noir-wallet/sdk type-check
      - run: pnpm --filter @noir-wallet/sdk build
      - run: pnpm --filter @noir-wallet/sdk --if-present test
      - run: pnpm --filter @noir-wallet/example type-check
      - run: pnpm --filter @noir-wallet/example build
      - run: pnpm --filter @noir-wallet/sdk pack:dry
