name: Build Extension

on:
  push:
    branches: [main, v2, 'release/**']
    paths:
      - 'packages/extension/**'
      - 'packages/rpc-registry/**'
      - 'packages/sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'LICENSE'
      - 'tsconfig.base.json'
      - '.npmrc'
      - 'CHANGELOG.md'
      - 'packages/web/public/changelog.json'
      - 'scripts/**'
      - 'wasm-package.lock.json'
      - '.github/workflows/*extension*.yml'
  pull_request:
    branches: [main, v2, 'release/**']
    paths:
      - 'packages/extension/**'
      - 'packages/rpc-registry/**'
      - 'packages/sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'LICENSE'
      - 'tsconfig.base.json'
      - '.npmrc'
      - 'CHANGELOG.md'
      - 'packages/web/public/changelog.json'
      - 'scripts/**'
      - 'wasm-package.lock.json'
      - '.github/workflows/*extension*.yml'

concurrency:
  group: extension-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  BUILD_CHANNEL: beta

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect changes that require extension ZIPs
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA=$(git rev-parse HEAD^)
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              echo 'build_required=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BASE_SHA=$BEFORE_SHA
          else
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/extension-changed-files"
          if grep -Ev '^packages/extension/(tests/|.*\.md$)' "$RUNNER_TEMP/extension-changed-files" |
            grep -E '^(packages/extension/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.node-version$|tsconfig\.base\.json$|\.npmrc$|wasm-package\.lock\.json$|LICENSE$)' > /dev/null; then
            echo 'build_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build_required=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify-wasm-pkg
      - run: pnpm test
      - run: pnpm build:extension
        if: steps.changes.outputs.build_required == 'true'
      - run: pnpm build:extension:testnet
        if: steps.changes.outputs.build_required == 'true'
      - name: Package tested previews
        if: steps.changes.outputs.build_required == 'true'
        id: package
        env:
          RELEASE_MODE: preview
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: node scripts/extension-release.mjs package . release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changes.outputs.build_required == 'true'
        with:
          name: noir-wallet-${{ steps.package.outputs.artifact_label }}
          path: release-assets/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
