name: Build Extension
run-name: ${{ github.event.label.name == 'preview' && 'Requested extension preview' || 'No extension preview requested' }}

on:
  pull_request:
    branches: [v2]
    types: [labeled]

concurrency:
  group: extension-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  preview:
    if: github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: wallet
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: wallet/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: release-tools/.node-version
          cache: pnpm
          cache-dependency-path: wallet/pnpm-lock.yaml
      - name: Record checked-out commits
        id: source
        run: |
          set -euo pipefail
          test "$(git -C wallet rev-parse HEAD)" = "$GITHUB_SHA"
          echo "workflow_sha=$(git -C release-tools rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
        working-directory: wallet
      - name: Type-check EVM History Worker
        run: pnpm --filter @noir-wallet/evm-history-worker type-check
        working-directory: wallet
      - run: pnpm test
        working-directory: wallet
      - name: Build development extension
        working-directory: wallet
        env:
          BUILD_CHANNEL: development
          BETA_INVITE_REQUIRED: '1'
          EVM_HISTORY_API_ORIGIN: ${{ vars.EVM_HISTORY_API_ORIGIN }}
        run: pnpm build:extension
      - name: Stage the single V2 ZIP
        run: |
          set -euo pipefail
          zips=(wallet/packages/extension/dist/*.zip)
          if [ "${#zips[@]}" -ne 1 ] || [ ! -f "${zips[0]}" ]; then
            echo '::error::Expected exactly one V2 extension ZIP'
            exit 1
          fi
          mkdir -p raw-zips/dist
          cp "${zips[0]}" raw-zips/dist/
      - name: Package development preview
        id: package
        env:
          SOURCE_PROFILE: multichain
          BUILD_CHANNEL: development
          RELEASE_MODE: preview
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ steps.source.outputs.workflow_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node release-tools/scripts/extension-release.mjs package wallet release-assets raw-zips
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noir-wallet-development-${{ steps.package.outputs.artifact_label }}
          path: release-assets/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
