name: Build Extension

on:
  pull_request:
    branches: [main, v2, 'release/**']
    paths:
      - 'packages/extension/**'
      - '!packages/extension/tests/**'
      - '!packages/extension/**/*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'LICENSE'
      - 'tsconfig.base.json'
      - '.npmrc'
      - 'wasm-package.lock.json'

concurrency:
  group: extension-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Determine source build profile
        id: profile
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { sourceProfileForVersion } from './scripts/extension-release.mjs'
          const { version } = JSON.parse(readFileSync('packages/extension/package.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `source_profile=${sourceProfileForVersion(version)}\n`)
          NODE
      - run: pnpm verify-wasm-pkg
        if: steps.profile.outputs.source_profile == 'zcash'
      - name: Type-check V2 EVM history Worker
        if: steps.profile.outputs.source_profile == 'multichain'
        run: pnpm --filter @noir-wallet/evm-history-worker type-check
      - run: pnpm test
      - run: pnpm build:extension
        env:
          BUILD_CHANNEL: ${{ steps.profile.outputs.source_profile == 'multichain' && 'development' || 'beta' }}
          EVM_HISTORY_API_ORIGIN: ${{ steps.profile.outputs.source_profile == 'multichain' && vars.EVM_HISTORY_API_ORIGIN || '' }}
      - run: pnpm build:extension:testnet
        if: steps.profile.outputs.source_profile == 'zcash'
        env:
          BUILD_CHANNEL: beta
      - name: Package tested previews
        id: package
        env:
          RELEASE_MODE: preview
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_PROFILE: ${{ steps.profile.outputs.source_profile }}
          BUILD_CHANNEL: ${{ steps.profile.outputs.source_profile == 'multichain' && 'development' || 'beta' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/extension-release.mjs package . release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noir-wallet-${{ steps.profile.outputs.source_profile == 'multichain' && 'development-' || '' }}${{ steps.package.outputs.artifact_label }}
          path: release-assets/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
