name: Build Extension

on:
  push:
    branches: [main, v2, 'release/**']
    paths:
      - 'packages/extension/**'
      - 'packages/rpc-registry/**'
      - 'packages/sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'LICENSE'
      - 'tsconfig.base.json'
      - '.npmrc'
      - 'CHANGELOG.md'
      - 'packages/web/public/changelog.json'
      - 'scripts/**'
      - 'wasm-package.lock.json'
      - '.github/workflows/*extension*.yml'
  pull_request:
    branches: [main, v2, 'release/**']
    paths:
      - 'packages/extension/**'
      - 'packages/rpc-registry/**'
      - 'packages/sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'LICENSE'
      - 'tsconfig.base.json'
      - '.npmrc'
      - 'CHANGELOG.md'
      - 'packages/web/public/changelog.json'
      - 'scripts/**'
      - 'wasm-package.lock.json'
      - '.github/workflows/*extension*.yml'

concurrency:
  group: extension-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  BUILD_CHANNEL: beta

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify-wasm-pkg
      - run: pnpm test
      - run: pnpm build:extension
      - run: pnpm build:extension:testnet
      - name: Package tested previews
        id: package
        env:
          RELEASE_MODE: preview
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: node scripts/extension-release.mjs package . release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: noir-wallet-${{ steps.package.outputs.artifact_label }}
          path: release-assets/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
