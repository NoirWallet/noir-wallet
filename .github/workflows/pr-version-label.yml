name: PR Version Label

on:
  pull_request_target:
    types: [opened, edited]
    branches: [main, v2]

permissions:
  pull-requests: write

concurrency:
  group: pr-version-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    if: github.event.action == 'opened' || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      # Only trusted metadata is read; never check out or execute PR code here.
      - name: Match the version label to the current target branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          PR_ENDPOINT="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          LABEL_ENDPOINT="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels"
          BASE_BRANCH=$(gh api "$PR_ENDPOINT" --jq '.base.ref')

          case "$BASE_BRANCH" in
            main|v2) ;;
            *) exit 0 ;;
          esac

          CURRENT_LABELS=$(gh api "$LABEL_ENDPOINT" --jq '.[].name')
          if [ "$BASE_BRANCH" = "v2" ]; then
            if ! printf '%s\n' "$CURRENT_LABELS" | grep -Fxq 'v2'; then
              gh api --method POST "$LABEL_ENDPOINT" -f 'labels[]=v2' >/dev/null
            fi
          elif printf '%s\n' "$CURRENT_LABELS" | grep -Fxq 'v2'; then
            gh api --method DELETE "$LABEL_ENDPOINT/v2" >/dev/null
          fi
