name: Prepare Extension Release
run-name: ${{ inputs.mode }} from ${{ inputs.source_ref }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Beta release or production candidate for acceptance
        required: true
        type: choice
        default: beta
        options: [beta, candidate]
      source_ref:
        description: Repository branch or full commit SHA; candidates require release/X.Y.Z
        required: true
        type: string
        default: main
      publish_beta:
        description: Publish beta to GitHub Releases (ignored for candidates)
        required: true
        type: boolean
        default: true
      confirm_sha:
        description: Full reviewed source SHA for candidates (ignored for beta)
        required: false
        type: string

concurrency:
  group: extension-manual-${{ inputs.mode }}-${{ inputs.source_ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  HUSKY: 0

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Pin and validate the selected source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          SOURCE_INPUT: ${{ inputs.source_ref }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        run: node scripts/extension-release-gates.mjs resolve
      - name: Show source for review
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        run: |
          printf '## Selected wallet source\n\n`%s` at `%s`\n' "$SOURCE_REF" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      # Selected wallet code runs here; trusted packaging uses a fresh job below.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: wallet
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: release-tools/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: release-tools/.node-version
          cache: pnpm
          cache-dependency-path: wallet/pnpm-lock.yaml
      - name: Verify pinned checkout
        working-directory: wallet
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - run: pnpm install --frozen-lockfile
        working-directory: wallet
      - run: pnpm verify-wasm-pkg
        working-directory: wallet
      - run: pnpm test
        working-directory: wallet
      - name: Build mainnet
        working-directory: wallet
        env:
          BUILD_CHANNEL: ${{ inputs.mode == 'candidate' && 'production' || 'beta' }}
          GA_API_SECRET: ${{ inputs.mode == 'candidate' && secrets.GA_API_SECRET || '' }}
          CUSTOM_ANALYTICS_PASSWORD: ${{ inputs.mode == 'candidate' && secrets.CUSTOM_ANALYTICS_PASSWORD || '' }}
        run: pnpm build:extension
      - name: Build testnet
        working-directory: wallet
        env:
          BUILD_CHANNEL: ${{ inputs.mode == 'candidate' && 'production' || 'beta' }}
        run: pnpm build:extension:testnet
      - name: Stage both network ZIPs
        run: |
          mkdir -p raw-zips/dist raw-zips/dist-testnet
          cp wallet/packages/extension/dist/*.zip raw-zips/dist/
          cp wallet/packages/extension/dist-testnet/*.zip raw-zips/dist-testnet/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: wallet-network-zips-${{ github.run_id }}-${{ github.run_attempt }}
          path: raw-zips/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  package:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      # No selected-source programs execute in the trusted packaging job.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: wallet
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: release-tools/.node-version
          package-manager-cache: false
      - name: Create isolated ZIP input directory
        run: mkdir raw-zips
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: raw-zips
      - name: Package the exact acceptance artifacts
        id: package
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: node release-tools/scripts/extension-release.mjs package wallet release-assets raw-zips
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: noir-wallet-${{ steps.package.outputs.artifact_label }}
          path: release-assets/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Show candidate acceptance details
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          printf '## Acceptance build\n\nRun ID: `%s`\n\nAttempt: `%s`\n\nSource SHA: `%s`\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  publish_beta:
    if: >-
      inputs.mode == 'beta' && inputs.publish_beta &&
      github.event.repository.fork == false &&
      (github.repository == 'NoirWallet/noir-wallet' || github.event.repository.private == false)
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: extension-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: release-assets
      - name: Verify beta artifact identity and checksums
        env:
          EXPECTED_MODE: beta
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/extension-release.mjs verify release-assets
      - name: Publish beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          gh release create "$TAG" --repo "$GH_REPO" \
            --title "Noir Wallet $TAG" --prerelease --latest=false --target "$SOURCE_SHA" \
            --notes-file release-assets/release-body.md \
            release-assets/*.zip release-assets/SHA256SUMS
