name: Extension Store Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-extension.yml'
      - '.github/workflows/extension-store-ci.yml'
      - 'scripts/extension-store-*.mjs'
      - 'scripts/extension-release*.mjs'
      - 'scripts/lib/crx3.mjs'
      - 'scripts/lib/release-zip.mjs'
      - 'scripts/lib/chrome-web-store.mjs'
      - 'scripts/lib/store-release-journal.mjs'
      - 'packages/extension/tests/extension-*.test.mjs'
      - 'packages/extension/tests/store-release-journal.test.mjs'
      - 'packages/extension/tests/fixtures/**'
      - '.node-version'

permissions:
  contents: read

concurrency:
  group: extension-store-rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sign-fixture:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
      metadata_sha256: ${{ steps.sign.outputs.metadata_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify release and store contracts without production credentials
        run: >-
          node --test packages/extension/tests/extension-release.test.mjs
          packages/extension/tests/extension-release-history.test.mjs
          packages/extension/tests/extension-crx.test.mjs
          packages/extension/tests/extension-store.test.mjs
          packages/extension/tests/store-release-journal.test.mjs
      - name: Sign a synthetic ZIP using a temporary RSA key
        id: sign
        run: node scripts/extension-store-rehearsal.mjs create rehearsal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: package
        with:
          name: cws-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: rehearsal/
          retention-days: 3
          if-no-files-found: error

  verify-fixture:
    needs: sign-fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-fixture.outputs.artifact_id }}
          path: rehearsal
      - name: Verify the transferred CRX and unchanged ZIP
        env:
          EXPECTED_DIGEST: ${{ needs.sign-fixture.outputs.metadata_sha256 }}
        run: node scripts/extension-store-rehearsal.mjs verify rehearsal "$EXPECTED_DIGEST"
