name = "noir-evm-history-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGIN = "*"

[[ratelimits]]
name = "HISTORY_RATE_LIMITER"
namespace_id = "61337001"

  [ratelimits.simple]
  limit = 120
  period = 60

# Secret: ANKR_API_KEYS contains comma-separated keys, e.g. key-one,key-two.
# Set it via the Cloudflare dashboard or `wrangler secret put ANKR_API_KEYS`.
